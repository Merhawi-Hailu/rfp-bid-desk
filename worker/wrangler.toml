name = "rfp-bid-desk-api"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Plain settings. These are not secret.
[vars]
# The web address of your GitHub Pages site. Add more, comma separated, if needed.
ALLOWED_ORIGINS = "https://merhawi-hailu.github.io"
# "workers-ai" uses Cloudflare's free AI allowance and needs no API key.
# "anthropic" uses Claude and needs the ANTHROPIC_API_KEY secret.
AI_PROVIDER = "workers-ai"
WORKERS_AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
CLAUDE_MODEL = "claude-sonnet-5-5"
SESSION_HOURS = "8"

# Cloudflare Workers AI. Free plan: 10,000 neurons per day, reset at 00:00 UTC.
[ai]
binding = "AI"

# Secrets are NOT set here. Set them once with:
#   npx wrangler secret put DEMO_PASSWORD
#   npx wrangler secret put SESSION_SECRET
# Only if AI_PROVIDER = "anthropic":
#   npx wrangler secret put ANTHROPIC_API_KEY

# Login attempts: 5 per minute per IP address.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Analysis calls: 10 per minute per signed in session.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
